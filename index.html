<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <title>Сайт временно не работает</title>
  <style>
    :root {
      --blue: #3399ff;
      --track: #f0f0f0;
      --text: #222;
      --muted: #777;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
    }

    body {
      background: #fff;
      color: var(--text);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .page {
      display: grid;
      grid-template-rows: auto 1fr auto;
      justify-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: clamp(24px, 6vh, 64px) 20px clamp(20px, 4vh, 40px);
      text-align: center;
    }

    .notice {
      max-width: 38rem;
    }

    .tag {
      margin: 0 0 12px;
      color: var(--blue);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(24px, 5vw, 36px);
      font-weight: 700;
      line-height: 1.2;
    }

    .text {
      margin: 0;
      color: var(--muted);
    }

    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      align-self: center;
      padding: 32px 0;
    }

    .ring {
      position: relative;
      width: min(320px, 68vw);
      aspect-ratio: 1;
      container-type: inline-size;
    }

    .ring svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .value {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #666;
      font: 700 15vw/1 Arial, Helvetica, sans-serif;
      font-size: 17cqw;
      font-variant-numeric: tabular-nums;
    }

    .left {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }

    .work {
      width: min(520px, 100%);
      text-align: left;
    }

    .work h2 {
      margin: 0 0 2px;
      font-size: 15px;
      font-weight: 600;
    }

    .count {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .log {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: 8.5em;
      margin: 0;
      padding: 0;
      overflow: hidden;
      list-style: none;
      font: 13px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .log li {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .done {
      color: #999;
    }

    .now::after {
      content: "";
      display: inline-block;
      width: 0.5em;
      height: 1em;
      margin-left: 2px;
      background: var(--text);
      vertical-align: -2px;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .now::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="notice">
      <p class="tag">Технические работы</p>
      <h1>Сайт не работает — идёт обновление</h1>
      <p class="text">
        Мы полностью переделываем сайт: меняем страницы и переписываем код.
        Если обновление не удастся завершить до 23 октября 2026 года,
        эта страница будет удалена полностью.
      </p>
    </header>

    <section class="center" aria-label="Ход обновления">
      <div class="ring">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle cx="100" cy="100" r="86" fill="none" stroke="#f0f0f0" stroke-width="16"></circle>
          <circle id="arc" cx="100" cy="100" r="86" fill="none" stroke="#3399ff" stroke-width="16"
                  transform="rotate(-90 100 100)"></circle>
        </svg>
        <div class="value" id="value">0,00%</div>
      </div>
      <p class="left" id="left"></p>
    </section>

    <section class="work">
      <h2>Идёт редактирование страниц и кода сайта</h2>
      <p class="count" id="count"></p>
      <ul class="log" id="log"></ul>
    </section>
  </main>

  <script>
    (function () {
      var START = new Date('2026-10-10T00:00:00+05:00').getTime();
      var END = new Date('2026-10-23T00:00:00+05:00').getTime();
      var DEADLINE = '23.10.2026';

      var PAGES = [
    'faq/delivery.html', 'coins/balance.html', 'news/openings.html', 'account/favorites.html',
    'about/values.html', 'contacts/feedback.html', 'careers/internship.html', 'support/rules.html',
    'coins/history.html', 'about/team.html', 'about/history.html', 'careers/barista.html',
    'careers/manager.html', 'account/password.html', 'gallery/halls.html', 'shop/catalog.html',
    'gallery/events.html', 'menu/seasonal.html', 'blog/post12.html', 'events/openmic.html',
    'support/terms.html', 'support/sitemap.html', 'shop/sale.html', 'events/latteart.html',
    'contacts/index.html', 'gallery/baristas.html', 'account/register.html', 'projects/crm.html',
    'events/concert.html', 'news/promo.html', 'projects/mobileapp.html', 'about/mission.html',
    'careers/cashier.html', 'gallery/photos2026.html', 'coins/rules.html', 'contacts/vacancies.html',
    'menu/cappuccino.html', 'faq/orders.html', 'news/latest.html', 'faq/payment.html',
    'coins/levels.html', 'news/rss.html', 'support/cookies.html', 'account/bonuses.html',
    'shop/giftcards.html', 'blog/archive.html', 'news/events2026.html', 'careers/index.html',
    'news/press.html', 'coins/promo.html', 'projects/reports.html', 'careers/apply.html',
    'gallery/photos2025.html', 'projects/telegrambot.html', 'account/settings.html', 'support/privacy.html',
    'coins/cards.html', 'docs/status.html', 'careers/courier.html', 'docs/changelog.html',
    'blog/post58.html', 'shop/returns.html', 'contacts/address.html', 'projects/akku.html',
    'careers/benefits.html', 'blog/post27.html', 'docs/install.html', 'projects/landing.html',
    'events/calendar.html', 'gallery/map.html', 'blog/index.html', 'menu/breakfast.html',
    'shop/wishlist.html', 'account/profile.html', 'news/archive.html', 'docs/api.html',
    'docs/security.html', 'faq/allergens.html', 'shop/checkout.html', 'projects/admin.html',
    'news/subscribe.html', 'shop/cart.html', 'faq/refunds.html', 'about/awards.html',
    'docs/license.html', 'coins/partners.html', 'coins/app.html', 'docs/config.html',
    'support/chat.html', 'projects/zebracoffee.html', 'events/brunch.html', 'docs/roadmap.html',
    'account/login.html', 'blog/post41.html', 'menu/drinkbuilder.html', 'support/help.html',
    'events/kidsday.html', 'contacts/partners.html', 'faq/hours.html', 'events/tasting.html',
    'blog/authors.html', 'menu/espresso.html', 'contacts/reservation.html', 'contacts/directions.html',
    'menu/tea.html', 'about/partners.html', 'blog/post34.html', 'faq/index.html',
    'about/press.html', 'support/tickets.html', 'gallery/videos.html', 'menu/desserts.html',
    'faq/loyalty.html', 'events/workshop.html', 'menu/latte.html', 'about/reviews.html',
    'account/orders.html', 'contacts/hours.html', 'shop/delivery.html', 'gallery/terrace.html'
      ];

      var arc = document.getElementById('arc');
      var value = document.getElementById('value');
      var left = document.getElementById('left');
      var count = document.getElementById('count');
      var log = document.getElementById('log');

      var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var circumference = 2 * Math.PI * Number(arc.getAttribute('r'));
      var intro = !calm;

      arc.style.strokeDasharray = circumference;

      function progress() {
        var p = (Date.now() - START) / (END - START) * 100;
        return Math.min(100, Math.max(0, p));
      }

      function draw(p) {
        arc.style.strokeDashoffset = circumference * (1 - p / 100);
        value.textContent = p >= 100 ? '100%' : p.toFixed(2).replace('.', ',') + '%';
      }

      function pad(n) {
        return n < 10 ? '0' + n : String(n);
      }

      function drawLeft() {
        var ms = END - Date.now();
        if (ms <= 0) {
          left.textContent = 'Обновление завершается';
          return;
        }
        var s = Math.floor(ms / 1000);
        var d = Math.floor(s / 86400);
        var h = Math.floor(s % 86400 / 3600);
        var m = Math.floor(s % 3600 / 60);
        left.textContent = 'До ' + DEADLINE + ' осталось ' + d + ' д ' + pad(h) + ' ч ' + pad(m) + ' мин ' + pad(s % 60) + ' с';
      }

      function tick() {
        if (!intro) draw(progress());
        drawLeft();
      }

      function runIntro() {
        var from = performance.now();
        function frame(now) {
          var k = Math.min(1, (now - from) / 1600);
          draw(progress() * (1 - Math.pow(1 - k, 3)));
          if (k < 1) {
            requestAnimationFrame(frame);
          } else {
            intro = false;
          }
        }
        requestAnimationFrame(frame);
      }

      function type(el, text, done) {
        if (calm) {
          el.textContent = '› ' + text;
          done();
          return;
        }
        var i = 0;
        var timer = setInterval(function () {
          i++;
          el.textContent = '› ' + text.slice(0, i);
          if (i >= text.length) {
            clearInterval(timer);
            done();
          }
        }, 24);
      }

      var index = 0;

      function step() {
        var path = 'pages/' + PAGES[index];
        var line = document.createElement('li');
        line.className = 'now';
        log.appendChild(line);
        while (log.children.length > 5) log.removeChild(log.firstChild);
        count.textContent = 'Редактируется страница ' + (index + 1) + ' из ' + PAGES.length;

        type(line, path, function () {
          setTimeout(function () {
            line.className = 'done';
            line.textContent = '✓ ' + path;
            index = (index + 1) % PAGES.length;
            setTimeout(step, 250 + Math.random() * 400);
          }, 600 + Math.random() * 900);
        });
      }

      if (intro) {
        draw(0);
        runIntro();
      } else {
        draw(progress());
      }
      drawLeft();
      setInterval(tick, 1000);
      step();
    })();
  </script>
</body>
</html>
