<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#83b9d0"/><stop offset=".58" stop-color="#d4e5dc"/><stop offset="1" stop-color="#f1e2bd"/></linearGradient>
 <linearGradient id="distant" x2="0" y2="1"><stop stop-color="#7e9c7c"/><stop offset="1" stop-color="#9eb48a"/></linearGradient>
 <linearGradient id="meadow" x2="0" y2="1"><stop stop-color="#8bad68"/><stop offset=".5" stop-color="#709456"/><stop offset="1" stop-color="#527849"/></linearGradient>
 <linearGradient id="path" x2="0" y2="1"><stop stop-color="#bbaa83"/><stop offset="1" stop-color="#d0bc94"/></linearGradient>
 <linearGradient id="plaster" x2="0" y2="1"><stop stop-color="#ead5af"/><stop offset="1" stop-color="#b99871"/></linearGradient>
 <linearGradient id="roof" x2="0" y2="1"><stop stop-color="#925947"/><stop offset="1" stop-color="#613f37"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="15"/></filter>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="8"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
